[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lakshman-rekha"
version = "1.0.0"
description = "The Inviolable Transaction Authorization Boundary & State Control Plane for Autonomous AI Agents"
readme = "README.md"
authors = [{ name = "Hariraj Rathod", email = "iamhariraj@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.urls]
"Homepage" = "https://github.com/harirajrathod/lakshman-rekha"
"Bug Tracker" = "https://github.com/harirajrathod/lakshman-rekha/issues"
